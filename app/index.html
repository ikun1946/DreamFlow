<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>即梦批量生成控制台</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="icon.png" />
<!-- 主题防闪（FOUC）：必须在**首帧渲染前**同步跑完，否则深色偏好下会先闪一帧浅色再切换。
     唯一事实来源：<html> 的 data-theme-mode（用户选择 auto/light/dark）+ data-theme（解析后的 light/dark）。
     取值逻辑与 app.js 的 applyTheme() 完全一致：auto 时跟随系统；显式选择优先于系统。
     容错：localStorage 在隐私模式下可能抛错 → 静默回落 auto。 -->
<script>(function(){try{var v=localStorage.getItem('jmc.theme');if(v!=='light'&&v!=='dark'&&v!=='auto')v='auto';var d=(v==='dark')||(v==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.setAttribute('data-theme-mode',v);r.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
</head>
<body>

<!-- hidden-view：启动时先藏起来，等 setView() 按 URL 决定该显示哪一层再放开。
     不藏的话首屏会先闪一下控制台（空表格骨架）再跳到首页。 -->
<div class="app hidden-view" id="app">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <img src="icon.png" alt="" width="18" height="18" />
      </span>
      <span class="brand-name">即梦批量生成控制台</span>
    </div>
    <span class="vdiv"></span>
    <!-- 面包屑（多项目架构）：首页 › 项目 › 分镜表。
         三段都是**静态节点、只改文本/显隐**，沿用顶栏既有做法（不重建 DOM，
         否则会打断进行中的点击与 hover）。点「首页」回项目列表，点项目名回项目主页。 -->
    <button class="crumb-link" id="crumbHome" title="返回项目列表">首页</button>
    <span class="crumb-sep" id="crumbSep1">›</span>
    <button class="crumb-link" id="projName" title="返回项目主页">—</button>
    <span class="crumb-sep" id="crumbSep2" hidden>›</span>
    <span class="crumb-cur" id="crumbWs" hidden>—</span>
    <span class="chip" id="scopeChip">第 1 批 · 0 个分镜</span>

    <span class="vdiv"></span>

    <span class="paramgrp">
      <!-- 2026-09-20：原「模型」「画幅」两个可点胶囊（各带一个下拉箭头）合并为一处纯文本。
           它们本来就只是显示全局默认值、点了只弹一句提示，并没有真正的下拉列表；
           合并成纯文本后少占 ~80px，正好给从底部状态栏移上来的「整体进度」腾位置。 -->
      <span class="paramtext" id="modelRatioTxt" title="默认模型 · 默认画幅（在「设置 → 生成参数默认值」里修改）">— · —</span>
    </span>

    <span class="grow"></span>

    <!-- 整体进度（2026-09-20 从底部状态栏移到顶栏）：进度百分比 + 进度条 + 预计剩余
         是一组读数，拆开摆会看不懂，所以整组一起搬上来。
         这里是静态节点，由 renderTopbar() 更新文本/宽度（顶栏既有做法），不重建 DOM。 -->
    <span class="top-progress">
      <span>整体进度 <b id="tpPct">0%</b></span>
      <span class="minibar"><i id="tpBar" style="width:0%"></i></span>
      <span>预计剩余 <b id="tpEta">--:--</b></span>
    </span>

    <span class="runstate"><i class="dot" id="runDot"></i><span id="runText">—</span></span>

    <span class="vdiv"></span>

    <button class="link" id="btnHistory">生成记录</button>
    <!-- 2026-09-20 顶栏重排：原「紧凑视图」按钮已移入设置 →「个性化」；
         「批量导入提示词」左移占它的位置，「提交所选」从素材面板顶栏移到它右侧。
         三者都是主操作（.btn-primary），尺寸靠同一套内联 padding 保持一致。 -->
    <button class="btn-primary" id="btnImport" title="批量导入提示词">
      <svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4.5 19.5h15" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      批量导入
    </button>
    <button class="btn-primary" id="btnSubmitSel" title="提交表格里勾选的分镜">提交所选</button>
    <button class="btn-outline" id="btnPanel" title="打开素材面板">
      <svg width="13" height="13" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M14.5 4.5v15" stroke="currentColor" stroke-width="2"/></svg>
      素材
    </button>
    <!-- 设置（2026-09-24：图标由「齿轮」改为**主题指示** —— 太阳 = 当前浅色，月亮 = 当前深色）
         ⚠ 它**只表示当前主题，不改变点击行为**：点下去照旧打开设置抽屉。
           这是刻意的取舍 —— 齿轮本身有歧义（画的是"圆 + 6 根分离射线"，13px 下与太阳撞脸，
           用户就被误导过），换成主题图标后它至少传达的是真实信息；但"设置"这个入口必须有
           非文字线索，所以文字标签保留。
         ⚠ 两个 SVG 叠放、由 CSS 按 <html data-theme> 交叉过渡（见 styles.css 的 .tt-ico）——
           不靠 JS 换节点，所以两个 svg 必须同时存在。
         ⚠ 刻意用**实心**（fill），而全站图标是描边：实心与描边一眼可分，13px 下也看得清。 -->
    <button class="btn-outline" id="btnSettings" data-theme-icon title="打开设置：分隔符 / 生成参数默认值 / 队列与执行 / 创作 CLI">
      <span class="tt-ico" aria-hidden="true"><svg class="tt-sun" width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg><svg class="tt-moon" width="13" height="13" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg></span>
      设置
    </button>
  </header>

  <!-- ========== 主体（列头在滚动容器内 sticky，横向滚动时与表体同步） ========== -->
  <main class="main">
    <section class="tablecol">
      <div class="colhead" id="colhead"></div>
      <div class="table" id="table"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <!-- ========== 底部状态栏 ========== -->
  <footer class="statusbar" id="statusbar"></footer>

  <!-- ========== 素材批量操作条（批量选择模式下自底部向上弹出） ========== -->
  <div class="batchbar" id="batchbar"></div>
</div>

<!-- 素材面板遮罩：仅 ≤1440px 面板覆盖层化时使用，点击关闭面板 -->
<div class="mask" id="panelMask" hidden></div>

<!-- ⚠ P3 可访问性：屏幕阅读器播报区。
     aria-live=polite + role=status 让 toast() 写入文本时被 NVDA / VoiceOver 念出
     （同时 aria-atomic=false 让它只追加、不重复整段）。
     ⚠ 必须放在 body 顶层、不可放在任何一个会随弹层隐藏的容器里 —— 否则读屏工具
     在弹层出现时也会被"重新挂载"打断。 -->
<div id="srLive" class="sr-only" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- ========== P2 批量导入提示词 ========== -->
<div class="mask" id="importMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="modal-head">
      <h2 id="importTitle">批量导入提示词</h2>
      <span class="grow"></span>
      <button class="icon-btn" id="importClose" title="关闭" aria-label="关闭导入弹层">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label class="sec-title" for="importText">粘贴文本</label>
      <textarea id="importText" placeholder="把多段提示词粘进来，用下面的分隔符分开。&#10;例：镜头推进…;;雨滴落在玻璃窗…;;收音机特写…"></textarea>

      <div class="sec-title">分隔符（分段依据）</div>
      <div class="chips" id="importChips"></div>

      <div class="row-inline">
        <span class="label-sm">自定义分隔符</span>
        <input id="importCustom" class="input-sm" style="width:180px" value=";;" />
        <span class="hint-sm">支持任意字符或多字符组合，留空表示按换行拆分</span>
      </div>

      <div class="banner ok" id="importDetect" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 12.4l2.8 2.8L16 9.6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="importDetectTxt"></span>
      </div>

      <div class="sec-title">识别结果预览</div>
      <div class="preview" id="importPreview"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-outline" id="importCancel">取消</button>
      <span class="grow"></span>
      <button class="btn-primary" id="importOk" disabled>导入</button>
    </div>
  </div>
</div>

<!-- ========== P3 设置 ========== -->
<div class="mask drawer-mask" id="settingsMask" hidden></div>
<aside class="drawer" id="settingsDrawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="drawer-head">
    <h2 id="settingsTitle">设置</h2>
    <span class="grow"></span>
    <button class="icon-btn" id="settingsClose" title="关闭" aria-label="关闭设置">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="settingsBody"></div>
  <div class="drawer-foot">
    <button class="btn-outline" id="settingsReset">恢复默认</button>
    <span class="grow"></span>
    <button class="btn-primary" id="settingsSave">保存设置</button>
  </div>
</aside>

<!-- ========== 详情 / 预览弹层 ========== -->
<div class="mask" id="detailMask" hidden>
  <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-head">
      <h2 id="detailTitle">详情</h2>
      <span class="grow"></span>
      <button class="icon-btn" id="detailClose" title="关闭" aria-label="关闭详情弹层">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- ========== 首页：项目列表（多项目架构的根入口） ==========
     与 #recView 同构：作为 #app 的**兄弟节点**、position:fixed 铺满、靠 [hidden] 切换。
     z-index 取 65 —— 在弹层遮罩（60）之上、记录页与设置抽屉（70）之下，
     因此从项目主页能正常打开「生成记录」与「项目设置」，而弹层不会盖住本页。 -->
<section class="pageview" id="homeView" hidden aria-hidden="true">
  <header class="pv-head">
    <span class="brand-mark">
      <img src="icon.png" alt="" width="18" height="18" />
    </span>
    <h2>即梦批量生成控制台</h2>
    <span class="hint-sm" id="homeSummary">—</span>
    <span class="grow"></span>
    <button class="btn-outline" id="homeSettings" data-theme-icon title="打开设置：分隔符 / 生成参数默认值 / 队列与执行 / 创作 CLI">
      <span class="tt-ico" aria-hidden="true"><svg class="tt-sun" width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg><svg class="tt-moon" width="13" height="13" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg></span>
      设置
    </button>
    <button class="btn-outline" id="homeRefresh">刷新</button>
    <button class="btn-primary" id="homeNew">+ 创建项目</button>
  </header>
  <!-- ⚠ 与 #projView 同构：.pv-body 是「撑满剩余高度 + overflow:hidden」的容器，
       真正的滚动区是里面的 .pv-scroll。首页原先直接把 .pv-body 当渲染目标，
       于是项目卡片一多就被裁掉、滚不动（项目多了才发现）。 -->
  <div class="pv-body">
    <div class="pv-scroll" id="homeBody"></div>
  </div>
</section>

<!-- ========== 项目主页：分镜表（代码里叫 Workspace）列表 + 四个入口 ==========
     指令 §23：进入项目后先看到项目主页，而不是直接强行进入某张分镜表。 -->
<section class="pageview" id="projView" hidden aria-hidden="true">
  <header class="pv-head">
    <button class="icon-btn" id="projBack" title="返回项目列表">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 id="projTitle">—</h2>
    <span class="hint-sm" id="projSummary">—</span>
    <span class="grow"></span>
    <button class="btn-outline" id="projRename">重命名</button>
    <button class="btn-outline btn-danger" id="projDelete">删除项目</button>
    <!-- 彻底删除：连磁盘文件一起删，不可恢复。放在软删除右侧、用同一套危险样式，
         但点击后会要求把项目名原样打一遍才执行。 -->
    <button class="btn-outline btn-danger" id="projHardDelete" title="连磁盘上的素材与产物一起永久删除，不可恢复">彻底删除</button>
    <button class="btn-primary" id="projNewWs">+ 新建分镜表</button>
  </header>
  <div class="pv-tabs" id="projTabs"></div>
  <!-- 主体分两块：projBody 放「分镜表 / 资产库」这类由 innerHTML 直接渲染的内容；
       projMount 是**就地面板**槽位，用来把记录视图 / 设置面板整体搬进来（同一时刻最多一个）。
       这样切到「生成记录」时项目页的头与导航栏都保持不动，只有下方内容换掉 ——
       而不是像之前那样弹出一个覆盖整屏的独立视图，把头和导航一起盖掉。 -->
  <div class="pv-body">
    <div class="pv-scroll" id="projBody"></div>
    <div class="pv-mount" id="projMount" hidden></div>
  </div>
</section>

<div class="toasts" id="toasts"></div>

<!-- ========== 干跑：提交后核对真实命令（命令已生成，未发送给即梦） ========== -->
<div class="mask" id="cmdMask" hidden>
  <div class="modal wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="cmdTitle">干跑命令核对</h2>
      <span class="grow"></span>
      <button class="btn-mini" id="cmdCopyAll">复制全部命令</button>
      <button class="icon-btn" id="cmdClose" title="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="cmdBody"></div>
    <div class="modal-foot">
      <span class="hint-sm" id="cmdFootHint"></span>
      <span class="grow"></span>
      <button class="btn-primary" id="cmdOk">知道了</button>
    </div>
  </div>
</div>

<!-- ========== 自动匹配（按素材名称匹配图片参考与音色参考，先预览再应用） ========== -->
<div class="mask" id="autoMask" hidden>
  <div class="modal wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="autoTitle">自动匹配</h2>
      <span class="grow"></span>
      <button class="icon-btn" id="autoClose" title="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="autoBody"></div>
    <div class="modal-foot">
      <label class="checkline" title="默认只增补、不动已有绑定；勾选后，该分镜同一类型已有别的素材时会被替换">
        <input type="checkbox" id="autoOverwrite" /> 覆盖同类型已有绑定
      </label>
      <span class="hint-sm" id="autoHint"></span>
      <span class="grow"></span>
      <button class="btn-outline" id="autoCancel">取消</button>
      <button class="btn-primary" id="autoApply" disabled>应用到分镜</button>
    </div>
  </div>
</div>

<!-- ========== 按提示词「总时长」标注重算时长（先预览，再应用） ========== -->
<div class="mask" id="durMask" hidden>
  <div class="modal wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="durTitle">按时长标注重算</h2>
      <span class="grow"></span>
      <button class="icon-btn" id="durClose" title="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="durBody"></div>
    <div class="modal-foot">
      <span class="hint-sm" id="durHint"></span>
      <span class="grow"></span>
      <button class="btn-outline" id="durCancel">取消</button>
      <button class="btn-primary" id="durApply" disabled>应用</button>
    </div>
  </div>
</div>

<!-- ========== 生成记录（全屏视图：左侧列表 / 右侧详情，窄屏自动改单栏） ========== -->
<section class="recview" id="recView" hidden aria-hidden="true">
  <header class="rec-head">
    <button class="icon-btn" id="recBack" title="返回控制台">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2>生成记录</h2>
    <span class="hint-sm" id="recSummary">—</span>
    <span class="grow"></span>
    <select class="input-sm" id="recFormat" title="导出格式">
      <option value="md">Markdown（含提示词与命令）</option>
      <option value="csv">CSV（表格）</option>
      <option value="json">JSON（全量）</option>
    </select>
    <button class="btn-outline" id="recExport">导出当前筛选</button>
    <button class="btn-outline btn-danger" id="recClear">清空记录…</button>
    <button class="btn-dark" id="recRefresh">刷新</button>
  </header>

  <!-- 筛选条（由 renderRecords 渲染：分段筛选 + 搜索 + 时间范围） -->
  <div class="rec-bar" id="recBar"></div>

  <div class="rec-body">
    <div class="rec-col">
      <div class="rec-listhead" id="recListHead"></div>
      <div class="rec-list" id="recList"></div>
      <div class="rec-pager" id="recPager"></div>
    </div>
    <aside class="rec-detail" id="recDetail"></aside>
  </div>
</section>

<script src="api.js"></script>
<script src="constants.js"></script>
<script src="app.js"></script>
</body>
</html>
