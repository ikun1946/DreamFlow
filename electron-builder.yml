# ============================================================
# electron-builder.yml —— Windows 安装包配置
#
# 设计取舍（对着"数据安全"和"能装能用"两条来定）：
#   · perMachine: false → 装到 %LOCALAPPDATA%\Programs，**不弹 UAC**。
#     代价是不能给"所有用户"安装，但换来双击即装、不需要管理员。
#   · 数据目录**不在**安装目录里（见 desktop/runtime-paths.js），
#     所以升级/卸载/重装都不会碰用户的项目和视频。
#   · deleteAppDataOnUninstall: false → 卸载只删程序，绝不删用户数据。
# ============================================================
appId: com.ikun1946.jimengconsole
productName: 即梦批量生成控制台
copyright: Copyright © 2026 ikun1946

directories:
  output: release
  buildResources: build

# ============================================================
# 发布元数据（latest.yml）—— 2026-09-22 补
#
# 为什么必须有这一段：electron-builder **只在配置了 publish provider 时**
# 才生成 `latest.yml`。而没有它，`npm run dist` 只产出 exe 与 .blockmap ——
# 但 `latest.yml` 恰恰是应用内自更新读取「最新版是多少 + 校验和」的唯一来源，
# 缺它则更新链路静默失效（安装包传上去也没人能发现新版）。
#
# 历史踩坑：0.22.0–0.29.4 期间没有这一段，于是每次发版都要在命令行手加
#   --config.publish.provider=github --config.publish.owner=ikun1946 --config.publish.repo=DreamFlow
# 才拿得到 latest.yml（0.29.5 的 Release 就是这么发的）。写进配置后，
# 直接 `npm run dist` 即可产出 —— 见 docs/版本发布与更新流程.md §4。
#
# ⚠ provider: github 只用于「生成元数据 + 知道去哪找」，**不代表本地打包会上传**。
#   想明确禁止上传：npm run dist -- --publish never
# ============================================================
publish:
  - provider: github
    owner: ikun1946
    repo: DreamFlow

# 只打包运行时真正需要的东西。把仓库里的文档、脚本、旧数据排除掉，
# 既减小体积，也避免把开发机上的东西（比如 server/data 里的库）误发给别人。
files:
  - package.json
  - app/**/*
  - server/**/*
  - desktop/**/*
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - '!server/data/**'
  - '!server/**/*.md'
  - '!**/*.map'
  - '!**/.DS_Store'

# 图标要作为**真实文件**存在于 resources 下：托盘/窗口图标走 nativeImage，
# 从 asar 里读在个别环境下不稳（desktop/main.js 的 assetPath 会优先找这里）。
extraResources:
  - from: build/icon.png
    to: build/icon.png

asar: true
# 需要以真实文件形式被外部程序读取的，必须解包（当前没有，留规则以便将来加 bin/）
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # asInvoker：不请求管理员权限。要写机器级目录的软件才需要 elevated，
  # 而本应用所有可写数据都在用户目录下。
  requestedExecutionLevel: asInvoker
  # 可执行文件名（开始菜单/任务管理器里显示的名字）
  # 2026-09-23（0.32.0）由 JimengConsole 改为 DreamFlow —— 换名第二步。
  # ⚠ 这会**迁移安装目录**：NSIS 的默认安装目录用的是 executableName，不是 productName
  #   （实测 0.25.0 装在 %LOCALAPPDATA%\Programs\JimengConsole\）。靠 appId 的 GUID 识别
  #   已装实例，**不会新旧并存**，但会走「先卸后装」、快捷方式重建、任务栏固定项可能失效。
  #   用户数据在 %USERPROFILE%\Videos\JimengConsole\ 下，不受影响。
  # ⚠ 必须与 desktop/updater.js 的 ARTIFACT_PREFIX 同时改 —— 门禁 §4 会比对这两处。
  executableName: DreamFlow
  # ⚠ 签名配置**必须在 win: 之下**（见上方"代码签名（P0-5）"注释块）。
  # 2026-09-22 教训：这两个键原先写在顶层，electron-builder 26 的 schema 直接拒绝 ——
  # 报 "configuration has an unknown property 'signAndEditExecutable' / 'signtoolOptions'"
  # 并中止构建。顶层写法在旧版本上或许能过，但 26 只认 win.*（CI 首次跑红即此因）。
  signAndEditExecutable: true
  signtoolOptions:
    # 只签安装器与主程序（+ 卸载器），不签每个 dll —— 减少签名次数与耗时
    signingHashAlgorithms:
      - sha256
    # 发布者名称。与证书 Subject 的 CN 一致即可；留空则由证书决定。
    # 若填了但与证书不符，signtool 会报错，属于有意为之的护栏。
    publisherName: ikun1946
    # RFC3161 时间戳服务。列表按顺序尝试；全失败则构建报警告但不中断，
    # 便于内网 / 离线环境也能出包。
    rfc3161TimeStampServer: http://timestamp.digicert.com
    timeStampServer: http://timestamp.digicert.com

# ============================================================
# 代码签名（P0-5）
#
# 目标：消除 SmartScreen「未知发布者」警告，让用户在 Windows 10/11 上
#       双击安装包不会看到红色警告。
#
# 凭据来源**只能**是环境变量，证书文件**绝不入库**：
#   CSC_LINK          签名证书的路径或 base64 data URL
#                     （.pfx/.p12；也支持 https:// 链接，因含私钥仍需保密）
#   CSC_KEY_PASSWORD  证书私钥口令
#
# 用法（本机 PowerShell，凭据只活在当前会话）：
#   $env:CSC_LINK="C:\secrets\dreamflow-codesign.pfx"
#   $env:CSC_KEY_PASSWORD="******"
#   npm run dist
#
# 若不想让口令出现在环境变量里，electron-builder 也支持
#   $env:CSC_LINK="base64:<证书的 base64>"
# 但仍建议只在本机 / CI 的 secret 里设置。
#
# ⚠ 若 CSC_LINK 未设置：electron-builder 不会签名，构建仍会**成功**，
#   只在日志里给一行提示。这是刻意留的「开发机构建」通路 ——
#   日常 `npm run pack` 不该被签名凭据卡住。
#   想强制要求签名（正式发布）请用：
#     .\scripts\check-signing.js --require
#   或设置  $env:CSC_REQUIRE="1"  后再执行 npm run dist。
#
# 时间戳（timestamping）必须开：否则证书过期后已分发安装包的签名会失效，
# 用户会重新看到警告。这里锁 RFC3161 服务，并允许回退。
# ============================================================
# ⚠ 真正的签名配置写在下面的 `win:` 块里（`win.signAndEditExecutable` / `win.signtoolOptions`）——
#   electron-builder 26 的 schema **不接受顶层写法**，写在顶层会直接中止构建（2026-09-22 CI 首次跑红即此因）。
#   凭据来源不变：`CSC_LINK` / `CSC_KEY_PASSWORD` 由 electron-builder 自己从环境变量读取，无需在此声明。
# ============================================================

nsis:
  # 非一键安装：让用户能看到装到哪、能改路径
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # ⚠ 安装目录**无法通过配置指定**（2026-09-23 实测结论，别重试）。
  #   electron-builder 26 的 NsisOptions 共 42 项，**不含任何安装目录属性**；
  #   写 `installDir:` 会被 schema 直接拒绝并中止构建（"does not match the API schema"）。
  #   目录实际由两段 NSIS 逻辑推导：
  #     ① multiUser.nsh —— 升级时优先继承注册表 HKCU\Software\{GUID}\InstallLocation 的旧路径；
  #     ② assistedInstaller.nsh 的 instFilesPre —— 路径不含**当前**应用名时再追加一层。
  #   对新用户的结果就是 %LOCALAPPDATA%\Programs\<executableName>（本来就正确）；
  #   只有"从旧应用名升级"的老用户会多一层（实测 0.25.0 → 0.32.0 落到
  #   Programs\JimengConsole\DreamFlow），且**只发生一次** —— 此后 InstallLocation 已含新名，
  #   两段逻辑都不再改动它，是稳定的原地升级。
  #   若确需强制统一路径，唯一途径是 `nsis.include` 注入自定义 .nsh 改写 $INSTDIR ——
  #   但那会把老用户的应用再迁一次，收益不足，故有意不做。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 即梦批量生成控制台
  # ⚠ 关键：卸载**不删**用户数据。数据库、素材、视频都在用户目录里，
  # 卸载只应该带走程序本身。
  deleteAppDataOnUninstall: false
  # 安装时不要自动拉起应用：用户刚点完安装，多半想先自己看一眼
  runAfterFinish: false
  # 0.32.0：JimengConsole- → DreamFlow-（换名第二步；须与 updater.js 的 ARTIFACT_PREFIX 同改，
  # 但 updater 的白名单**必须继续接受旧的 JimengConsole- 前缀** —— 老用户机器上可能残留
  # JimengConsole-*.part-* 临时文件，见 updater.js 的 ACCEPTED_PREFIXES）
  artifactName: DreamFlow-${version}-x64-Setup.${ext}

# 不生成 32 位与 ARM 包：本机目标就是 Win10/11 x64（计划 §4 首版范围）
portable:
  artifactName: DreamFlow-${version}-portable.${ext}
