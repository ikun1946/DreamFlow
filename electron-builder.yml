publish:
  - provider: github
    owner: ikun1946
    repo: DreamFlow

# 只打包运行时真正需要的东西。把仓库里的文档、脚本、旧数据排除掉，
# 既减小体积，也避免把开发机上的东西（比如 server/data 里的库）误发给别人。
files:
  - package.json
  - app/**/*
  - server/**/*
  - desktop/**/*
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - '!server/data/**'
  - '!server/**/*.md'
  - '!**/*.map'
  - '!**/.DS_Store'

# 图标要作为**真实文件**存在于 resources 下：托盘/窗口图标走 nativeImage，
# 从 asar 里读在个别环境下不稳（desktop/main.js 的 assetPath 会优先找这里）。
extraResources:
  - from: build/icon.png
    to: build/icon.png

asar: true
# 需要以真实文件形式被外部程序读取的，必须解包（当前没有，留规则以便将来加 bin/）
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # asInvoker：不请求管理员权限。要写机器级目录的软件才需要 elevated，
  # 而本应用所有可写数据都在用户目录下。
  requestedExecutionLevel: asInvoker
  # 可执行文件名（开始菜单/任务管理器里显示的名字）
  # 2026-09-23（0.32.0）由 JimengConsole 改为 DreamFlow —— 换名第二步。
  # ⚠ 这会**迁移安装目录**：NSIS 的默认安装目录用的是 executableName，不是 productName
  #   （实测 0.25.0 装在 %LOCALAPPDATA%\Programs\JimengConsole\）。靠 appId 的 GUID 识别
  #   已装实例，**不会新旧并存**，但会走「先卸后装」、快捷方式重建、任务栏固定项可能失效。
  #   用户数据在 %USERPROFILE%\Videos\JimengConsole\ 下，不受影响。
  # ⚠ 必须与 desktop/updater.js 的 ARTIFACT_PREFIX 同时改 —— 门禁 §4 会比对这两处。
  executableName: DreamFlow
nsis:
  # 非一键安装：让用户能看到装到哪、能改路径
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # ⚠ 安装目录**无法通过配置指定**（2026-09-23 实测结论，别重试）。
  #   electron-builder 26 的 NsisOptions 共 42 项，**不含任何安装目录属性**；
  #   写 `installDir:` 会被 schema 直接拒绝并中止构建（"does not match the API schema"）。
  #   目录实际由两段 NSIS 逻辑推导：
  #     ① multiUser.nsh —— 升级时优先继承注册表 HKCU\Software\{GUID}\InstallLocation 的旧路径；
  #     ② assistedInstaller.nsh 的 instFilesPre —— 路径不含**当前**应用名时再追加一层。
  #   对新用户的结果就是 %LOCALAPPDATA%\Programs\<executableName>（本来就正确）；
  #   只有"从旧应用名升级"的老用户会多一层（实测 0.25.0 → 0.32.0 落到
  #   Programs\JimengConsole\DreamFlow），且**只发生一次** —— 此后 InstallLocation 已含新名，
  #   两段逻辑都不再改动它，是稳定的原地升级。
  #   若确需强制统一路径，唯一途径是 `nsis.include` 注入自定义 .nsh 改写 $INSTDIR ——
  #   但那会把老用户的应用再迁一次，收益不足，故有意不做。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 即梦批量生成控制台
  # ⚠ 关键：卸载**不删**用户数据。数据库、素材、视频都在用户目录里，
  # 卸载只应该带走程序本身。
  deleteAppDataOnUninstall: false
  # 安装时不要自动拉起应用：用户刚点完安装，多半想先自己看一眼
  runAfterFinish: false
  # 0.32.0：JimengConsole- → DreamFlow-（换名第二步；须与 updater.js 的 ARTIFACT_PREFIX 同改，
  # 但 updater 的白名单**必须继续接受旧的 JimengConsole- 前缀** —— 老用户机器上可能残留
  # JimengConsole-*.part-* 临时文件，见 updater.js 的 ACCEPTED_PREFIXES）
  artifactName: DreamFlow-${version}-x64-Setup.${ext}

# 不生成 32 位与 ARM 包：本机目标就是 Win10/11 x64（计划 §4 首版范围）
portable:
  artifactName: DreamFlow-${version}-portable.${ext}
