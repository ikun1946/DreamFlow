<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>即梦批量生成控制台</title>
<style>
/* ============================================================
   即梦批量生成控制台 · 样式
   视觉系统：明色 · 单一强调色 Action Blue · 无装饰渐变与阴影
   ============================================================ */

:root{
  --canvas:#FFFFFF;
  --parchment:#F5F5F7;
  --pearl:#FAFAFC;
  --ink:#1D1D1F;
  --ink80:#333333;
  --ink48:#7A7A7A;
  --primary:#0066CC;
  --primary-bg:#E6F0FA;
  --hairline:#E0E0E0;
  --divider:#F0F0F0;
  --chipgray:#D2D2D7;
  --ok:#248A3D;      --ok-bg:#E7F6EC;
  --err:#D70015;     --err-bg:#FDE8E7;
  --warn:#8A5A00;    --warn-bg:#FFF6E5;
  --track:#F0F0F0;

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;

  --row-h:210px;
  --thumb-h:60px; --thumb-w:46px;
  --vid-w:84px;   --vid-h:54px;
  --panel-w:320px;
  --table-w:1280px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  font-size:13px;
  color:var(--ink);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.2px}
.grow{flex:1}
.vdiv{width:1px;height:16px;background:var(--hairline);flex:none}

/* ============================ 骨架 ============================ */
.app{
  display:grid;
  grid-template-rows:52px 40px 1fr 32px;
  height:100vh;
  min-width:0;
}
.app.compact{ --row-h:132px; --thumb-h:40px; --thumb-w:32px; --vid-w:56px; --vid-h:36px; }

/* ============================ 顶栏 ============================ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 16px 0 20px;
  border-bottom:1px solid var(--hairline);
  min-width:0;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{display:grid;place-items:center}
.brand-name{font-weight:600;font-size:13px;white-space:nowrap}
.proj{font-size:13px;color:var(--ink80);white-space:nowrap}
.chip{
  font-size:11px;color:var(--ink48);background:var(--parchment);
  padding:4px 8px;border-radius:6px;white-space:nowrap;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:6px 10px 6px 12px;border-radius:999px;
  background:var(--parchment);white-space:nowrap;transition:background .15s;
}
.pill:hover{background:#ECECEF}
.runstate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink80);white-space:nowrap}
.runstate .dot{width:6px;height:6px;border-radius:999px;background:var(--primary)}
.runstate.off .dot{background:#FF9F0A}
.runstate.err .dot{background:var(--err)}
.link{font-size:12px;color:var(--primary);white-space:nowrap}
.link:hover{text-decoration:underline}
.btn-outline{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:7px 14px;border-radius:999px;
  background:#fff;border:1px solid var(--primary);color:var(--primary);
  white-space:nowrap;transition:background .15s;
}
.btn-outline:hover{background:var(--primary-bg)}
.btn-outline:disabled{opacity:.4;cursor:not-allowed}
.btn-dark{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:8px 13px;border-radius:8px;
  background:var(--ink);color:#fff;white-space:nowrap;transition:opacity .15s;
}
.btn-dark:hover{opacity:.88}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;padding:10px 20px;border-radius:999px;
  background:var(--primary);color:#fff;white-space:nowrap;transition:opacity .15s;
}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}

/* ============================ 列头 ============================ */
.colhead{
  display:grid;
  grid-template-columns:44px 340px 160px 100px 100px 86px 84px 190px 94px 82px;
  align-items:center;
  height:40px;
  background:var(--pearl);
  border-bottom:1px solid var(--hairline);
  overflow-x:auto;overflow-y:hidden;
  min-width:0;
}
.colhead::-webkit-scrollbar{height:0}
.colhead > *{display:flex;align-items:center;gap:5px;padding-left:10px;font-size:11px;font-weight:600;color:var(--ink48);white-space:nowrap;overflow:hidden}
.colhead > .c-rail{justify-content:center;padding-left:0}

/* ============================ 主体 ============================ */
.main{
  display:grid;
  grid-template-columns:1fr var(--panel-w);
  min-height:0;
}
.tablecol{min-width:0;overflow:auto;position:relative}
.table{width:100%;min-width:var(--table-w)}

/* ---------- 行 ---------- */
.row{
  display:grid;
  grid-template-columns:44px 340px 160px 100px 100px 86px 84px 190px 94px 82px;
  height:var(--row-h);
  align-items:center;
  background:#fff;
  border-bottom:1px solid var(--divider);
}
.row.sel{background:#F7FAFD}
.cell{height:100%;display:flex;align-items:center;overflow:hidden;padding:0 10px;min-width:0}
.cell.rail{flex-direction:column;justify-content:center;gap:8px;padding:0}
.cell.prompt{flex-direction:column;align-items:stretch;justify-content:center;gap:5px;padding:0 14px 0 10px}
.cell.result{flex-direction:column;justify-content:center;gap:7px;padding:0 10px}

/* 序号栏 */
.rail-num{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink48)}
.cbx{
  width:16px;height:16px;border-radius:4px;flex:none;
  border:1px solid var(--chipgray);background:#fff;
  display:grid;place-items:center;transition:background .12s,border-color .12s;
}
.cbx.on{background:var(--primary);border-color:var(--primary)}
.cbx svg{opacity:0;transition:opacity .12s}
.cbx.on svg{opacity:1}

/* 提示词列 */
.titleline{display:flex;align-items:center;gap:8px;min-width:0}
.shotno{font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.prompt-text{
  font-size:12.5px;line-height:19px;color:var(--ink80);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prompt-meta{font-size:11px;color:var(--ink48);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 时长步进器 */
.dur{
  display:inline-flex;align-items:center;gap:3px;padding:3px;
  background:var(--parchment);border-radius:6px;flex:none;
}
.dur button{width:14px;height:14px;display:grid;place-items:center;border-radius:3px}
.dur button:hover{background:#E4E4E8}
.dur button:disabled{opacity:.3;cursor:not-allowed;background:none}
.dur .val{
  min-width:34px;height:20px;padding:0 6px;border-radius:4px;
  background:#fff;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;
  border:1px solid transparent;cursor:text;user-select:none;
}
.dur.focus .val{border-color:var(--primary)}
.dur .val input{
  width:26px;border:0;outline:0;background:#D6E6F7;border-radius:2px;
  font-family:var(--mono);font-size:12px;font-weight:600;text-align:center;
}
.dur.locked .val{color:var(--ink48);cursor:not-allowed}
.dur.locked button{opacity:.25;cursor:not-allowed;background:none}

/* 素材格 */
.slots{display:flex;align-items:center;gap:8px;min-width:0}
.thumb{
  width:var(--thumb-w);height:var(--thumb-h);border-radius:8px;flex:none;
  position:relative;overflow:hidden;display:grid;place-items:center;
  background:var(--parchment);
  background-image:var(--g);
}
.thumb span{
  position:absolute;left:0;right:0;bottom:0;
  font-size:9px;line-height:14px;text-align:center;color:#fff;
  background:rgba(0,0,0,.34);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.thumb .rm{
  position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:999px;
  background:rgba(0,0,0,.5);display:none;place-items:center;
}
.thumb:hover .rm{display:grid}
.slot-add{
  width:var(--thumb-w);height:var(--thumb-h);border-radius:8px;flex:none;
  border:1px dashed var(--chipgray);background:var(--pearl);
  display:grid;place-items:center;transition:border-color .15s,background .15s;
}
.slot-add:hover{border-color:var(--primary);background:var(--primary-bg)}
.dash{font-size:13px;color:var(--chipgray)}

/* 结果与进度 */
.result-thumb{
  width:var(--vid-w);height:var(--vid-h);border-radius:8px;flex:none;
  position:relative;display:grid;place-items:center;overflow:hidden;
  background:var(--parchment);background-image:var(--g);cursor:pointer;
}
.result-thumb.plain{background-image:none;border:1px dashed var(--chipgray);background:var(--pearl);cursor:default}
.result-thumb.failed{background-image:none;border:1px dashed #F79E99;background:var(--err-bg)}
.progline{display:flex;align-items:center;gap:8px;width:100%}
.bar{flex:1;height:5px;border-radius:999px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--primary);width:0;transition:width .35s linear}
.bar > i.ok{background:#34C759}
.bar > i.err{background:var(--err)}
.pct{font-family:var(--mono);font-size:11px;color:var(--ink80);flex:none;width:38px;text-align:right}

/* 状态徽标 */
.badge{
  display:inline-flex;align-items:center;font-size:11px;font-weight:500;
  padding:5px 10px;border-radius:999px;white-space:nowrap;
}
.badge.queued{background:var(--track);color:var(--ink48)}
.badge.generating{background:var(--primary-bg);color:var(--primary)}
.badge.succeeded{background:var(--ok-bg);color:var(--ok)}
.badge.failed{background:var(--err-bg);color:var(--err)}
.badge.canceled{background:var(--track);color:var(--ink48)}

/* 操作 */
.cell.acts{gap:6px;padding:0 10px}
.icon-act{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;flex:none}
.icon-act:hover{background:var(--parchment)}
.icon-act:disabled{opacity:.28;cursor:not-allowed;background:none}

/* ============================ 素材面板 ============================ */
.panel{border-left:1px solid var(--hairline);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-top{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;flex:none}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--parchment);border-radius:8px}
.seg button{font-size:11.5px;padding:5px 12px;border-radius:6px;color:var(--ink48)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.panel-search{display:flex;align-items:center;gap:7px;height:32px;margin:0 14px 8px;padding:0 10px;background:var(--parchment);border-radius:8px;flex:none}
.panel-search input{flex:1;border:0;outline:0;background:none;font-size:11.5px;min-width:0}
.panel-search input::placeholder{color:var(--ink48)}
.sec-head{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;flex:none}
.sec-head b{font-size:12px;font-weight:600}
.sec-head span{font-size:10.5px;color:var(--ink48)}
.grid{display:grid;grid-template-columns:repeat(4,60px);gap:10px 8px;padding:0 14px 12px}
.acard{display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.acard .pic{width:60px;height:60px;border-radius:8px;background:var(--parchment);background-image:var(--g);position:relative;overflow:hidden}
.acard .pic .tick{
  position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:999px;
  background:rgba(255,255,255,.92);display:none;place-items:center;
}
.acard.used .pic .tick{display:grid}
.acard .nm{font-size:10.5px;color:var(--ink80);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard.add .pic{border:1px dashed var(--chipgray);background:var(--pearl);background-image:none;display:grid;place-items:center}
.acard.add .nm{color:var(--ink48)}
.panel-list{overflow-y:auto;flex:1;min-height:0}
.empty-mini{padding:28px 16px;text-align:center;font-size:11.5px;color:var(--ink48)}

/* ============================ 状态栏 ============================ */
.statusbar{
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:var(--parchment);border-top:1px solid var(--hairline);
  font-size:11px;color:var(--ink48);white-space:nowrap;overflow:hidden;
}
.statusbar b{font-family:var(--mono);color:var(--ink80);font-weight:600}
.minibar{width:88px;height:5px;border-radius:999px;background:#E4E4E8;overflow:hidden;flex:none}
.minibar > i{display:block;height:100%;width:0;background:var(--primary);transition:width .4s}
.btn-mini{
  font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;
  background:#fff;border:1px solid var(--primary);color:var(--primary);
}
.btn-mini:hover{background:var(--primary-bg)}

/* ============================ 弹窗 / 抽屉 ============================ */
.mask{position:fixed;inset:0;background:rgba(20,22,28,.28);display:grid;place-items:center;z-index:60}
.mask[hidden]{display:none}
.drawer-mask{place-items:stretch;justify-items:end}
.modal{
  width:820px;max-width:calc(100vw - 40px);max-height:88vh;
  background:#fff;border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;
}
.modal.narrow{width:640px}
.modal-head{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px 0 32px;flex:none}
.modal-body{padding:24px 32px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;align-items:center;gap:10px;height:76px;padding:0 32px;background:var(--pearl);border-top:1px solid var(--divider);flex:none}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.icon-btn:hover{background:var(--parchment)}
.sec-title{font-size:14px;font-weight:600}
.modal-body textarea{
  width:100%;height:150px;resize:vertical;padding:14px 16px;
  border:1px solid var(--hairline);border-radius:11px;outline:0;
  font-size:14px;line-height:26px;font-family:var(--font);
}
.modal-body textarea:focus{border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  font-size:13px;padding:8px 16px;border-radius:999px;
  background:var(--parchment);color:var(--ink80);
}
.chips button.on{background:var(--primary);color:#fff;font-weight:600}
.chips button.dashed{border:1px dashed var(--chipgray);background:var(--parchment)}
.row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.label-sm{font-size:13px;color:var(--ink80)}
.hint-sm{font-size:12px;color:var(--ink48)}
.input-sm{padding:8px 12px;border:1px solid var(--hairline);border-radius:8px;outline:0;font-family:var(--mono);font-weight:600}
.input-sm:focus{border-color:var(--primary);border-width:1.5px}
.banner{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:11px;font-size:13px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--err-bg);color:var(--err)}
.preview{border:1px solid var(--hairline);border-radius:11px;overflow:hidden}
.preview .pr{display:flex;align-items:center;height:38px;padding:0 16px;font-size:13px;color:var(--ink80);gap:8px}
.preview .pr + .pr{border-top:1px solid var(--divider)}
.preview .pr .idx{font-family:var(--mono);font-size:11px;color:var(--ink48);flex:none}
.preview .pr .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .pr .dup{font-size:10.5px;color:var(--warn);flex:none}
.preview .none{padding:16px;font-size:12px;color:var(--ink48)}

/* 抽屉 */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;z-index:70;
  background:#fff;border-left:1px solid var(--hairline);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;height:68px;padding:0 24px 0 32px;flex:none}
.drawer-body{padding:24px 32px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.drawer-foot{display:flex;align-items:center;gap:10px;height:76px;padding:0 32px;background:var(--pearl);border-top:1px solid var(--divider);flex:none}
.sgroup{display:flex;flex-direction:column;gap:3px}
.sgroup > b{font-size:14px;font-weight:600}
.sgroup > span{font-size:12px;color:var(--ink48)}
.hr{height:1px;background:var(--divider);margin:4px 0}
.srow{display:flex;align-items:center;justify-content:space-between;height:44px;gap:10px}
.srow .k{font-size:13px;color:var(--ink80)}
.srow .v{font-size:13px;color:var(--primary);cursor:pointer}
.switch{width:44px;height:26px;border-radius:999px;background:var(--track);position:relative;transition:background .18s;flex:none}
.switch.on{background:var(--primary)}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:#fff;transition:transform .18s}
.switch.on i{transform:translateX(18px)}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:22px;height:22px;border-radius:6px;background:var(--parchment);display:grid;place-items:center}
.stepper button:hover{background:#E4E4E8}
.stepper b{font-family:var(--mono);font-size:13px;min-width:16px;text-align:center}
.statecard{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:11px;background:var(--warn-bg);font-size:13px;color:var(--warn)}
.statecard.ok{background:var(--ok-bg);color:var(--ok)}
.example{padding:14px 16px;border-radius:11px;background:var(--parchment);display:flex;flex-direction:column;gap:6px}
.example .lab{font-size:12px;color:var(--ink48)}
.example .in{font-size:13px;color:var(--ink)}
.example .out{font-size:12px;color:var(--ok)}

/* 详情 */
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink48)}
.kv dd{margin:0;color:var(--ink80);word-break:break-all}
.codebox{
  background:#0B0D12;color:#9FE8D2;border-radius:8px;padding:12px 14px;
  font-family:var(--mono);font-size:11.5px;line-height:20px;white-space:pre-wrap;word-break:break-all;
}
.logline{font-family:var(--mono);font-size:11.5px;line-height:20px;color:var(--ink80)}
.logline.err{color:var(--err)}
.logline.ok{color:var(--ok)}

/* ============================ 三态 ============================ */
.skeleton{padding:24px}
.sk-row{display:flex;gap:16px;align-items:center;height:72px;border-bottom:1px solid var(--divider)}
.sk{background:linear-gradient(90deg,#F0F0F2 25%,#F7F7F9 37%,#F0F0F2 63%);background-size:400% 100%;border-radius:6px;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.empty,.errorbox{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:70px 24px;color:var(--ink48);text-align:center;font-size:12.5px;
}
.empty b,.errorbox b{font-size:14px;font-weight:600;color:var(--ink)}
.empty button,.errorbox button{margin-top:4px}

/* ============================ 下拉菜单 ============================ */
.menu{
  position:fixed;z-index:90;min-width:150px;padding:6px;
  background:#fff;border:1px solid var(--hairline);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}
.menu button{
  display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 10px;
  border-radius:6px;font-size:12.5px;color:var(--ink80);font-family:var(--mono);
}
.menu button:hover{background:var(--parchment)}
.menu button.on{background:var(--parchment);color:var(--primary);font-weight:600}
.menu button .tick{margin-left:auto;display:grid;place-items:center}

/* ============================ Toast ============================ */
.toasts{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;
  background:rgba(29,29,31,.94);color:#fff;font-size:12.5px;
  animation:tin .22s cubic-bezier(.2,.9,.3,1.2);max-width:min(560px,90vw);
}
.toast.err{background:rgba(180,8,18,.96)}
.toast.ok{background:rgba(28,110,52,.96)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}

/* ============================ 滚动条 ============================ */
::-webkit-scrollbar{width:10px;height:10px}

<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   api.js —— 接口层（唯一与后端耦合的地方）
   ============================================================
   两种模式，改一行即可切换：

     mock（默认）：全部 23 个接口由本地内存 + 模拟生成引擎实现，
                   前端可独立跑通、可演示、可给后端当契约参照。
     http        ：真实请求后端。路径、请求体、响应体、错误码
                   与《前端页面与接口对接说明.md》第 4/5 章完全一致。

   切换方式：在 index.html 里、引入本文件之前，先插一段内联配置，内容为
     window.APP_CONFIG = { apiMode: 'http', baseUrl: 'https://your-api.com/api/v1', token: '<token>' };
   （完整示例见 README.md「切换后端」一节）

   约定（与文档一致）：
     - 统一响应信封 { code, message, data, traceId }，code !== 0 视为业务失败
     - 失败统一抛 ApiError(code, message, data, traceId)，由 app.js 统一 Toast
     - 列表接口顺带返回 stats，避免首屏串行两请求
     - 轮询接口只返回「有变化」的项
   ============================================================ */
(function (global) {
  'use strict';

  const CFG = (global.APP_CONFIG = Object.assign({
    apiMode: 'mock',            // 'mock' | 'http'
    baseUrl: '/api/v1',
    projectId: 'pj_1',
    latency: [60, 180],         // mock 下模拟网络耗时，便于看到骨架屏
    tickMs: 1200
  }, global.APP_CONFIG || {}));

  /* ---------------------------------------------------------- 错误 */
  const ERR = {
    OK: 0,
    PARAM: 40001, UNAUTH: 40100, FORBIDDEN: 40300, NOTFOUND: 40400,
    CONFLICT: 40900, RATELIMIT: 42900, INTERNAL: 50000,
    CLI_DOWN: 51001, NO_CREDIT: 51002, AUDIT: 51003, UPSTREAM_TIMEOUT: 51004, INTERRUPTED: 51005
  };

  class ApiError extends Error {
    constructor(code, message, data, traceId) {
      super(message || '请求失败');
      this.code = code; this.data = data; this.traceId = traceId;
    }
  }

  /* ------------------------------------------------ 枚举（/meta/options） */
  const META = {
    projectName: '雨夜归途',
    models: [
      { value: 'dreamina-v3.0',     label: '即梦视频 3.0',  enabled: true },
      { value: 'dreamina-v2.5-pro', label: '即梦视频 2.5 Pro', enabled: true },
      { value: 'seedance-2.0',      label: 'Seedance 2.0', enabled: true },
      { value: 'seedance-2.0-fast', label: 'Seedance 2.0 Fast', enabled: false, disabledReason: '当前账号未开通' }
    ],
    ratios: [
      { value: '16:9', label: '16:9' }, { value: '9:16', label: '9:16' },
      { value: '1:1',  label: '1:1'  }, { value: '4:3',  label: '4:3' }
    ],
    resolutions: [
      { value: '480p', label: '480p' }, { value: '720p', label: '720p' }, { value: '1080p', label: '1080p' }
    ],
    duration: {
      min: 1, max: 30, step: 1, defaultValue: 5,
      presets: [5, 10, 12], unit: 's', allowCustom: true
    },
    settings: {
      delimiterTypes: [
        { value: 'newline', label: '换行符' },
        { value: 'custom',  label: '自定义' }
      ],
      delimiterPresets: [';;', '|', '---'],
      concurrency: { min: 1, max: 5, defaultValue: 2 },
      autoRetry: { defaultValue: true, maxRetry: 2 }
    }
  };

  /* ---------------------------------------------------------- 工具 */
  const rid = (p) => p + Math.random().toString(36).slice(2, 8);
  const now = () => new Date().toISOString();
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const lat = () => Math.round(CFG.latency[0] + Math.random() * (CFG.latency[1] - CFG.latency[0]));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* 缩略图占位：由 ID 派生稳定渐变，避免依赖任何外部图片资源 */
  const GRADS = [
    'linear-gradient(135deg,#2B3A55,#5B7A9E)',
    'linear-gradient(135deg,#4A3550,#9A6B8E)',
    'linear-gradient(135deg,#2F4A38,#5E9E78)',
    'linear-gradient(135deg,#5A4326,#B08D52)',
    'linear-gradient(135deg,#33384A,#6E7A99)',
    'linear-gradient(135deg,#54303A,#A06070)'
  ];
  function grad(seed) {
    let h = 0;
    for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
    return GRADS[h % GRADS.length];
  }

  /* ---------------------------------------------------------- 内存库 */
  const DB = { storyboards: [], assets: [], settings: null, seq: 0 };

  function seed() {
    DB.assets = [
      { id: 'as_c1', name: '林彻',   type: 'character', gradSeed: 'c1' },
      { id: 'as_c2', name: '苏晚',   type: 'character', gradSeed: 'c2' },
      { id: 'as_c3', name: '周敬',   type: 'character', gradSeed: 'c3' },
      { id: 'as_c4', name: '老陈',   type: 'character', gradSeed: 'c4' },
      { id: 'as_c5', name: '群演甲', type: 'character', gradSeed: 'c5' },
      { id: 'as_c6', name: '群演乙', type: 'character', gradSeed: 'c6' },
      { id: 'as_s1', name: '雨夜街道', type: 'scene' },
      { id: 'as_s2', name: '便利店',   type: 'scene' },
      { id: 'as_s3', name: '山谷',     type: 'scene' },
      { id: 'as_s4', name: '车内',     type: 'scene' },
      { id: 'as_s5', name: '天台',     type: 'scene' },
      { id: 'as_s6', name: '沙漠',     type: 'scene' },
      { id: 'as_p1', name: '收音机', type: 'prop' },
      { id: 'as_p2', name: '雨伞',   type: 'prop' },
      { id: 'as_p3', name: '手机',   type: 'prop' },
      { id: 'as_p4', name: '车钥匙', type: 'prop' }
    ].map((a) => Object.assign(a, {
      projectId: CFG.projectId,
      url: 'mock://asset/' + a.id,
      thumbUrl: 'mock://asset/' + a.id + '/thumb',
      width: 1024, height: 1024, tags: [],
      grad: grad(a.gradSeed || a.id)
    }));

    const A = (id, role) => ({ assetId: id, role });
    const rows = [
      ['无人机穿过云层下降，山谷中的湖泊逐渐显现，晨雾未散，镜头持续前推。', 10, 'dreamina-v3.0', '16:9', '1080p', 0.65, 'generating', 46, [A('as_c1', 'character'), A('as_c2', 'character'), A('as_s3', 'scene')]],
      ['深夜便利店，收银员抬头看向门口，暖黄灯管轻微闪烁，镜头缓慢横移。', 5, 'seedance-2.0', '16:9', '720p', 0.55, 'queued', 0, [A('as_c4', 'character'), A('as_s2', 'scene')]],
      ['老式收音机特写，旋钮被缓慢转动，指针扫过刻度，暖色台灯侧光。', 12, 'dreamina-v3.0', '4:3', '720p', 0.40, 'succeeded', 100, [A('as_c4', 'character'), A('as_s2', 'scene'), A('as_p1', 'prop')], { firstFrame: true, storyboard: true }],
      ['沙漠中一辆越野车扬起沙尘疾驰，长焦压缩空间，金色逆光。', 10, 'dreamina-v3.0', '16:9', '720p', 0.80, 'failed', 62, [A('as_c3', 'character'), A('as_s6', 'scene')], { errorCode: '51002', errorMessage: '积分不足，无法完成该分镜' }],
      ['雨夜街道积水倒映霓虹，穿风衣的人影背对镜头渐远。', 5, 'seedance-2.0', '9:16', '720p', 0.60, 'generating', 12, [A('as_c1', 'character'), A('as_s1', 'scene'), A('as_p2', 'prop')]],
      ['天台上两个人对坐，远处城市灯火，镜头缓慢环绕。', 10, 'dreamina-v2.5-pro', '16:9', '1080p', 0.45, 'queued', 0, [A('as_c1', 'character'), A('as_c2', 'character'), A('as_s5', 'scene')]],
      ['车内在雨中行驶，雨刷来回摆动，挡风玻璃外霓虹糊成光斑。', 5, 'seedance-2.0', '16:9', '720p', 0.50, 'succeeded', 100, [A('as_c4', 'character'), A('as_s4', 'scene'), A('as_p4', 'prop')], { firstFrame: true }],
      ['手机屏幕亮起，一条未读消息，拇指悬停在屏幕上。', 5, 'dreamina-v3.0', '9:16', '720p', 0.35, 'succeeded', 100, [A('as_c1', 'character'), A('as_s4', 'scene'), A('as_p3', 'prop')], { firstFrame: true, storyboard: true }]
    ];

    DB.storyboards = rows.map((r, i) => {
      const [prompt, durationSec, model, ratio, resolution, motion, status, progress, assets, extra] = r;
      const id = 'st_' + (1000 + i);
      const assetsAll = assets.slice();
      // 首帧图 / 分镜图 复用本行的场景素材：同一镜头的参考画面应当一致
      const sceneRef = assets.find((x) => x.role === 'scene');
      if (extra && extra.firstFrame && sceneRef) assetsAll.push(A(sceneRef.assetId, 'firstFrame'));
      if (extra && extra.storyboard && sceneRef) assetsAll.push(A(sceneRef.assetId, 'storyboard'));
      const done = status === 'succeeded';
      return {
        id, projectId: CFG.projectId, batchId: 'bt_21', seq: i + 1,
        prompt, negativePrompt: '', durationSec, model, ratio, resolution,
        seed: 'random', motion, status, progress,
        etaSeconds: status === 'generating' ? Math.max(2, Math.round((100 - progress) / 9)) : null,
        remoteId: status === 'queued' ? null : 'jm_' + (0x9f2c1a + i * 7919).toString(16),
        videoUrl: done ? 'mock://output/' + id + '.mp4' : null,
        coverUrl: done ? 'mock://output/' + id + '.jpg' : null,
        currentFrameUrl: null,
        elapsedMs: done ? 12000 + i * 2100 : null,
        retryCount: 0,
        errorCode: (extra && extra.errorCode) || null,
        errorMessage: (extra && extra.errorMessage) || null,
        canEditDuration: status !== 'succeeded',
        assets: assetsAll,
        createdAt: now(), startedAt: status === 'queued' ? null : now(),
        finishedAt: done ? now() : null,
        _dirty: true, _runtime: null
      };
    });

    DB.seq = DB.storyboards.length;
    DB.settings = {
      delimiter: { type: 'custom', value: ';;' },
      defaults: { model: 'dreamina-v3.0', ratio: '16:9', resolution: '720p', durationSec: 5, motion: 0.55, negativePrompt: '' },
      queue: { concurrency: 2, autoRetry: true, maxRetry: 2 },
      adapter: { mode: 'mock', cliAvailable: false, cliVersion: null }
    };
  }
  seed();

  /* ---------------------------------------------------------- 模拟生成引擎 */
  const engine = { timer: null, listeners: new Set() };

  function emit() { engine.listeners.forEach((cb) => { try { cb(); } catch (e) { /* noop */ } }); }

  function step() {
    const q = DB.settings.queue;
    const all = DB.storyboards;
    const running = all.filter((s) => s.status === 'generating');

    // 1. 排队 → 生成
    let slots = q.concurrency - running.length;
    if (slots > 0) {
      all.filter((s) => s.status === 'queued').slice(0, slots).forEach((s) => {
        s.status = 'generating';
        s.progress = 1;
        s.startedAt = now();
        s.remoteId = 'jm_' + rid('');
        s.etaSeconds = s.durationSec * 3;
        s._runtime = { inc: 5 + Math.random() * 10 };
        s._dirty = true;
      });
    }

    // 2. 推进生成中
    all.filter((s) => s.status === 'generating').forEach((s) => {
      const rt = (s._runtime = s._runtime || { inc: 5 + Math.random() * 10 });
      s.progress = Math.min(100, s.progress + rt.inc);
      s.etaSeconds = Math.max(0, Math.round((100 - s.progress) / 9));
      s._dirty = true;
      if (s.progress >= 100) {
        s.progress = 100; s.status = 'succeeded';
        s.videoUrl = 'mock://output/' + s.id + '.mp4';
        s.coverUrl = 'mock://output/' + s.id + '.jpg';
        s.finishedAt = now();
        s.elapsedMs = 9000 + Math.round(Math.random() * 12000);
        s.etaSeconds = 0;
        s.canEditDuration = false;   // 与文档 8.2 建议一致：完成后锁定时长
        s._runtime = null;
        s._dirty = true;
      }
    });

    // 3. 通知外部（前端可不依赖它，仅用于让 mock 场景下的 UI 及时刷新）
    if (all.some((s) => s._dirty)) emit();
  }

  function startEngine() {
    if (engine.timer || CFG.apiMode !== 'mock') return;
    engine.timer = setInterval(step, CFG.tickMs);
  }
  function stopEngine() {
    if (engine.timer) { clearInterval(engine.timer); engine.timer = null; }
  }

  /* ---------------------------------------------------------- 视图装配 */
  const assetOf = (id) => DB.assets.find((a) => a.id === id) || { id, name: '未知素材', grad: grad(id) };

  function decorate(s) {
    return Object.assign({}, s, {
      assets: s.assets.map((r) => {
        const a = assetOf(r.assetId);
        return { assetId: a.id, role: r.role, name: a.name, thumbUrl: a.thumbUrl, url: a.url, grad: a.grad };
      }),
      grad: grad(s.id)
    });
  }
  const bySeq = (a, b) => a.seq - b.seq;

  function stats() {
    const all = DB.storyboards;
    const c = { queued: 0, generating: 0, succeeded: 0, failed: 0, canceled: 0 };
    all.forEach((s) => c[s.status]++);
    const finished = c.succeeded + c.failed + c.canceled;
    const remain = all.length - finished;
    const avg = 14;   // 秒
    const conc = Math.max(1, DB.settings.queue.concurrency);
    return {
      total: all.length,
      queued: c.queued, generating: c.generating, succeeded: c.succeeded,
      failed: c.failed, canceled: c.canceled,
      overallProgress: all.length ? Math.round((finished / all.length) * 100) : 0,
      etaSeconds: remain ? Math.round((remain * avg) / conc) : 0
    };
  }

  /* ---------------------------------------------------------- mock 路由 */
  async function mockRoute(method, path, opt) {
    await sleep(lat());
    const q = opt.query || {};
    const b = opt.body || {};
    const m = (re) => (path.match(re) || []).slice(1);

    /* ---- 元数据 ---- */
    if (method === 'GET' && path === '/meta/options') {
      return Object.assign({}, META, { projectName: META.projectName });
    }
    if (method === 'GET' && path === '/auth/me') {
      return { userId: 'u_1', name: '张导', credits: 1280, plan: 'pro' };
    }
    if (method === 'GET' && path === '/system/adapter') {
      return Object.assign({}, DB.settings.adapter, {
        checkedAt: now(),
        message: DB.settings.adapter.cliAvailable
          ? 'jimeng CLI 已就绪'
          : '未检测到 jimeng CLI，任务将入队但不执行'
      });
    }

    /* ---- 设置 ---- */
    if (method === 'GET' && path === '/settings') return JSON.parse(JSON.stringify(DB.settings));
    if (method === 'PUT' && path === '/settings') {
      const s = b;
      if (s.queue && (s.queue.concurrency < 1 || s.queue.concurrency > 5)) {
        throw new ApiError(ERR.PARAM, '参数校验失败', { fields: [{ path: 'queue.concurrency', message: '范围为 1–5' }] });
      }
      if (s.delimiter && s.delimiter.type === 'custom' && !s.delimiter.value) {
        throw new ApiError(ERR.PARAM, '参数校验失败', { fields: [{ path: 'delimiter.value', message: '自定义分隔符不能为空' }] });
      }
      DB.settings = Object.assign({}, DB.settings, s, {
        adapter: Object.assign({}, DB.settings.adapter, (s.adapter || {}))
      });
      if (DB.settings.adapter.mode === 'cli' && !DB.settings.adapter.cliAvailable) stopEngine();
      else startEngine();
      return JSON.parse(JSON.stringify(DB.settings));
    }
    if (method === 'POST' && path === '/settings/reset') {
      const scopes = b.scopes || ['delimiter', 'defaults', 'queue'];
      if (scopes.includes('delimiter')) DB.settings.delimiter = { type: 'custom', value: ';;' };
      if (scopes.includes('defaults'))  DB.settings.defaults  = { model: 'dreamina-v3.0', ratio: '16:9', resolution: '720p', durationSec: 5, motion: 0.55, negativePrompt: '' };
      if (scopes.includes('queue'))     DB.settings.queue     = { concurrency: 2, autoRetry: true, maxRetry: 2 };
      return JSON.parse(JSON.stringify(DB.settings));
    }

    /* ---- 列表 + 统计 ---- */
    if (method === 'GET' && path === '/storyboards' || method === 'GET' && /^\/projects\/[^/]+\/storyboards$/.test(path)) {
      let list = DB.storyboards.slice().sort(bySeq);
      if (q.status) {
        const want = String(q.status).split(',').map((s) => s.trim()).filter(Boolean);
        if (want.length) list = list.filter((s) => want.includes(s.status));
      }
      if (q.keyword) {
        const k = String(q.keyword).toLowerCase();
        list = list.filter((s) => s.prompt.toLowerCase().includes(k) || s.id.includes(k) || (s.remoteId || '').includes(k));
      }
      const page = Number(q.page || 1), pageSize = Number(q.pageSize || 20);
      const total = list.length;
      const slice = list.slice((page - 1) * pageSize, page * pageSize);
      slice.forEach((s) => { s._dirty = false; });
      return { list: slice.map(decorate), page, pageSize, total, stats: stats() };
    }

    /* ---- 轮询：只返回有变化的项 ---- */
    if (method === 'GET' && path === '/storyboards/progress') {
      const ids = String(q.ids || '').split(',').map((s) => s.trim()).filter(Boolean);
      const changed = DB.storyboards.filter((s) => ids.includes(s.id) && s._dirty);
      changed.forEach((s) => { s._dirty = false; });
      return changed.map((s) => ({
        id: s.id, status: s.status, progress: Math.round(s.progress),
        etaSeconds: s.etaSeconds, currentFrameUrl: s.currentFrameUrl,
        videoUrl: s.videoUrl, coverUrl: s.coverUrl,
        retryCount: s.retryCount, errorCode: s.errorCode, errorMessage: s.errorMessage,
        canEditDuration: s.canEditDuration
      }));
    }

    /* ---- 单条 ---- */
    let mm = m(/^\/storyboards\/([^/]+)$/);
    if (mm.length) {
      const s = DB.storyboards.find((x) => x.id === mm[0]);
      if (!s) throw new ApiError(ERR.NOTFOUND, '分镜不存在');
      if (method === 'GET') {
        return Object.assign(decorate(s), {
          cliCommand: 'jimeng video create --prompt "' + s.prompt + '" --model ' + s.model +
            ' --ratio ' + s.ratio + ' --duration ' + s.durationSec + 's --resolution ' + s.resolution +
            ' --motion ' + s.motion + ' --output ./output/' + s.id + '.mp4 --json',
          logs: (s._logs || []).slice(-20)
        });
      }
      if (method === 'PATCH') {
        if (b.durationSec != null && !s.canEditDuration) {
          throw new ApiError(ERR.CONFLICT, '分镜已完成，修改时长需重新生成');
        }
        if (b.durationSec != null) {
          const d = META.duration;
          const v = clamp(Math.round(Number(b.durationSec)), d.min, d.max);
          if (!isFinite(v)) throw new ApiError(ERR.PARAM, '时长不合法');
          s.durationSec = v;
        }
        ['prompt', 'model', 'ratio', 'resolution', 'seed', 'motion', 'negativePrompt'].forEach((k) => {
          if (b[k] != null) s[k] = b[k];
        });
        s._dirty = true;
        return decorate(s);
      }
      if (method === 'DELETE') {
        DB.storyboards = DB.storyboards.filter((x) => x.id !== s.id);
        renumber();
        return { deleted: [s.id] };
      }
    }

    mm = m(/^\/storyboards\/([^/]+)\/(cancel|retry)$/);
    if (mm.length && method === 'POST') {
      const s = DB.storyboards.find((x) => x.id === mm[0]);
      if (!s) throw new ApiError(ERR.NOTFOUND, '分镜不存在');
      if (mm[1] === 'cancel') {
        if (s.status === 'succeeded') throw new ApiError(ERR.CONFLICT, '已完成的分镜无法取消');
        s.status = 'canceled'; s.progress = 0; s.etaSeconds = 0; s.finishedAt = now(); s._runtime = null;
      } else {
        s.status = 'queued'; s.progress = 0; s.etaSeconds = null;
        s.errorCode = null; s.errorMessage = null; s.retryCount++; s._runtime = null;
        s.canEditDuration = true;
      }
      s._dirty = true;
      return decorate(s);
    }

    mm = m(/^\/storyboards\/([^/]+)\/(assets|reorder)$/);
    if (mm.length && method === 'POST') {
      const s = DB.storyboards.find((x) => x.id === mm[0]);
      if (!s) throw new ApiError(ERR.NOTFOUND, '分镜不存在');
      if (mm[1] === 'assets') {
        const role = b.role;
        const single = role !== 'character';
        if (single) s.assets = s.assets.filter((r) => r.role !== role);
        if (!s.assets.some((r) => r.assetId === b.assetId && r.role === role)) {
          s.assets.push({ assetId: b.assetId, role });
        }
      } else {
        const idx = DB.storyboards.slice().sort(bySeq).findIndex((x) => x.id === s.id);
        const to = b.direction === 'up' ? idx - 1 : idx + 1;
        const sorted = DB.storyboards.slice().sort(bySeq);
        if (to >= 0 && to < sorted.length) {
          const other = sorted[to];
          const t = s.seq; s.seq = other.seq; other.seq = t;
        }
      }
      s._dirty = true;
      return { id: s.id };
    }

    mm = m(/^\/storyboards\/([^/]+)\/assets\/([^/]+)$/);
    if (mm.length && method === 'DELETE') {
      const s = DB.storyboards.find((x) => x.id === mm[0]);
      if (!s) throw new ApiError(ERR.NOTFOUND, '分镜不存在');
      s.assets = s.assets.filter((r) => r.assetId !== mm[1]);
      s._dirty = true;
      return { id: s.id, removed: mm[1] };
    }

    /* ---- 批量 ---- */
    if (method === 'POST' && path === '/storyboards/batch-duration') {
      const updated = [], skipped = [];
      (b.ids || []).forEach((id) => {
        const s = DB.storyboards.find((x) => x.id === id);
        if (!s) return skipped.push({ id, reason: 'not_found', message: '分镜不存在' });
        if (!s.canEditDuration) return skipped.push({ id, reason: 'completed_locked', message: '已完成，已锁定时长' });
        s.durationSec = clamp(Math.round(Number(b.durationSec)), META.duration.min, META.duration.max);
        s._dirty = true; updated.push(id);
      });
      return { updated, skipped };
    }

    if (method === 'POST' && path === '/storyboards/batch-submit') {
      if (DB.settings.adapter.mode === 'cli' && !DB.settings.adapter.cliAvailable) {
        throw new ApiError(ERR.CLI_DOWN, '即梦 CLI 未连接，无法提交');
      }
      const accepted = [], rejected = [];
      (b.ids || []).forEach((id) => {
        const s = DB.storyboards.find((x) => x.id === id);
        if (!s) return rejected.push({ id, code: String(ERR.NOTFOUND), message: '分镜不存在' });
        if (s.status === 'generating' || s.status === 'queued') {
          return rejected.push({ id, code: String(ERR.CONFLICT), message: '该分镜已在队列中' });
        }
        if (s.errorCode === String(ERR.NO_CREDIT)) {
          return rejected.push({ id, code: String(ERR.NO_CREDIT), message: '积分不足，无法提交' });
        }
        s.status = 'queued'; s.progress = 0; s.errorCode = null; s.errorMessage = null;
        s.finishedAt = null; s.remoteId = null; s._dirty = true;
        accepted.push({ id, remoteId: null, status: 'queued' });
      });
      if (b.concurrency) DB.settings.queue.concurrency = clamp(Number(b.concurrency), 1, 5);
      startEngine();
      return { accepted, rejected };
    }

    if (method === 'POST' && path === '/storyboards/batch-delete') {
      const ids = b.ids || [];
      const running = DB.storyboards.filter((s) => ids.includes(s.id) && (s.status === 'generating' || s.status === 'queued'));
      if (running.length && !b.force) {
        throw new ApiError(ERR.CONFLICT, '存在运行中的分镜，请确认后强制删除', { ids: running.map((s) => s.id) });
      }
      const deleted = DB.storyboards.filter((s) => ids.includes(s.id)).map((s) => s.id);
      DB.storyboards = DB.storyboards.filter((s) => !ids.includes(s.id));
      renumber();
      return { deleted };
    }

    if (method === 'POST' && path === '/storyboards') {
      const d = DB.settings.defaults;
      const s = {
        id: rid('st_'), projectId: CFG.projectId, batchId: 'bt_21', seq: ++DB.seq,
        prompt: b.prompt || '', negativePrompt: b.negativePrompt || d.negativePrompt,
        durationSec: clamp(Number(b.durationSec || d.durationSec), META.duration.min, META.duration.max),
        model: b.model || d.model, ratio: b.ratio || d.ratio,
        resolution: b.resolution || d.resolution, seed: 'random',
        motion: b.motion != null ? b.motion : d.motion,
        status: 'queued', progress: 0, etaSeconds: null, remoteId: null,
        videoUrl: null, coverUrl: null, currentFrameUrl: null, elapsedMs: null,
        retryCount: 0, errorCode: null, errorMessage: null, canEditDuration: true,
        assets: [], createdAt: now(), startedAt: null, finishedAt: null,
        _dirty: true, _runtime: null
      };
      DB.storyboards.push(s);
      return decorate(s);
    }

    if (method === 'POST' && path === '/storyboards/import/preview') {
      const segs = splitSegments(b.rawText, b.delimiter);
      const existing = DB.storyboards.map((s) => s.prompt);
      const warnings = [];
      const out = segs.map((text, i) => {
        const dup = existing.includes(text);
        const tooLong = text.length > 2000;
        if (dup) warnings.push({ code: 'DUPLICATE', index: i + 1, message: '与已有分镜内容重复' });
        if (tooLong) warnings.push({ code: 'TOO_LONG', index: i + 1, message: '超过 2000 字' });
        return { index: i + 1, text, charCount: text.length, duplicate: dup, tooLong };
      });
      return { total: out.length, delimiterEcho: b.delimiter, segments: out, warnings };
    }

    if (method === 'POST' && path === '/storyboards/import') {
      const segs = splitSegments(b.rawText, b.delimiter);
      const d = Object.assign({}, DB.settings.defaults, b.defaults || {});
      const created = segs.map((text) => {
        const s = {
          id: rid('st_'), projectId: CFG.projectId, batchId: b.batchId || 'bt_21', seq: ++DB.seq,
          prompt: text, negativePrompt: d.negativePrompt || '',
          durationSec: clamp(Number(d.durationSec), META.duration.min, META.duration.max),
          model: d.model, ratio: d.ratio, resolution: d.resolution, seed: 'random',
          motion: d.motion, status: 'queued', progress: 0, etaSeconds: null, remoteId: null,
          videoUrl: null, coverUrl: null, currentFrameUrl: null, elapsedMs: null,
          retryCount: 0, errorCode: null, errorMessage: null, canEditDuration: true,
          assets: [], createdAt: now(), startedAt: null, finishedAt: null,
          _dirty: true, _runtime: null
        };
        DB.storyboards.push(s);
        return { id: s.id, seq: s.seq, status: s.status, prompt: s.prompt };
      });
      return { created, createdCount: created.length, batchId: 'bt_21', skipped: [] };
    }

    /* ---- 素材 ---- */
    if (method === 'GET' && path === '/assets') {
      const type = q.type || 'character';
      const kw = q.keyword ? String(q.keyword).toLowerCase() : '';
      let pool = DB.assets.filter((a) => a.type === type);
      if (kw) pool = pool.filter((a) => a.name.toLowerCase().includes(kw));
      const shot = q.inShotId ? DB.storyboards.find((s) => s.id === q.inShotId) : null;
      const usedIds = shot ? shot.assets.map((r) => r.assetId) : [];
      const view = (a) => Object.assign({}, a, { inCurrentShot: usedIds.includes(a.id) });
      const currentShot = usedIds.length
        ? DB.assets.filter((a) => usedIds.includes(a.id)).map(view)
        : [];
      return {
        currentShot,
        library: pool.map(view),
        counts: { currentShot: currentShot.length, library: pool.length }
      };
    }
    if (method === 'POST' && path === '/assets/upload') {
      throw new ApiError(ERR.INTERNAL, '演示环境未开启上传');
    }

    throw new ApiError(ERR.NOTFOUND, '接口不存在：' + method + ' ' + path);
  }

  function renumber() {
    DB.storyboards.slice().sort(bySeq).forEach((s, i) => { s.seq = i + 1; });
    DB.seq = DB.storyboards.length;
  }

  /* 拆分逻辑：与后端必须行为一致（trim 首尾、丢弃空段） */
  function splitSegments(rawText, delimiter) {
    const text = String(rawText || '');
    if (!text.trim()) return [];
    let parts;
    if (!delimiter || delimiter.type === 'newline' || !delimiter.value) {
      parts = text.split(/\r?\n/);
    } else {
      parts = text.split(delimiter.value);
    }
    return parts.map((p) => p.trim()).filter((p) => p.length > 0);
  }

  /* ---------------------------------------------------------- HTTP 路由 */
  function qs(query) {
    if (!query) return '';
    const pairs = Object.entries(query)
      .filter(([, v]) => v !== undefined && v !== null && v !== '')
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(Array.isArray(v) ? v.join(',') : v));
    return pairs.length ? '?' + pairs.join('&') : '';
  }

  async function httpRoute(method, path, opt) {
    const url = CFG.baseUrl + path + qs(opt.query);
    let res;
    try {
      res = await fetch(url, {
        method,
        headers: Object.assign(
          { 'Content-Type': 'application/json' },
          CFG.token ? { Authorization: 'Bearer ' + CFG.token } : {},
          opt.idempotencyKey ? { 'Idempotency-Key': opt.idempotencyKey } : {}
        ),
        body: opt.body ? JSON.stringify(opt.body) : undefined
      });
    } catch (e) {
      throw new ApiError(-1, '网络异常，请检查连接');
    }
    let json = null;
    try { json = await res.json(); } catch (e) { /* 非 JSON */ }
    if (!json) throw new ApiError(ERR.INTERNAL, '服务返回异常（HTTP ' + res.status + '）');
    if (json.code !== ERR.OK) throw new ApiError(json.code, json.message, json.data, json.traceId);
    return json.data;
  }

  function request(method, path, opt) {
    opt = opt || {};
    return CFG.apiMode === 'mock' ? mockRoute(method, path, opt) : httpRoute(method, path, opt);
  }

  /* ---------------------------------------------------------- 对外 API */
  const api = {
    CFG, META, ERR, ApiError,
    grad, assetOf,
    onEngineTick(cb) { engine.listeners.add(cb); return () => engine.listeners.delete(cb); },
    resumeEngine() { startEngine(); },

    getOptions:   ()          => request('GET', '/meta/options'),
    me:           ()          => request('GET', '/auth/me'),
    getAdapter:   ()          => request('GET', '/system/adapter'),

    listStoryboards: (query)  => request('GET', '/projects/' + CFG.projectId + '/storyboards', { query }),
    getProgress:  (ids)       => request('GET', '/storyboards/progress', { query: { ids: ids.join(',') } }),
    getStoryboard:(id)        => request('GET', '/storyboards/' + id),
    createStoryboard: (body)  => request('POST', '/storyboards', { body }),
    patchStoryboard: (id, body) => request('PATCH', '/storyboards/' + id, { body }),
    batchDuration:(ids, durationSec) => request('POST', '/storyboards/batch-duration', { body: { ids, durationSec } }),
    batchSubmit:  (ids, concurrency) => request('POST', '/storyboards/batch-submit', { body: { ids, concurrency }, idempotencyKey: rid('') }),
    cancel:       (id)        => request('POST', '/storyboards/' + id + '/cancel', { body: {} }),
    retry:        (id)        => request('POST', '/storyboards/' + id + '/retry', { body: { resetProgress: true } }),
    batchDelete:  (ids, force) => request('POST', '/storyboards/batch-delete', { body: { ids, force: !!force } }),
    reorder:      (id, direction) => request('POST', '/storyboards/' + id + '/reorder', { body: { direction } }),

    listAssets:   (query)     => request('GET', '/assets', { query }),
    bindAsset:    (id, assetId, role) => request('POST', '/storyboards/' + id + '/assets', { body: { assetId, role } }),
    unbindAsset:  (id, assetId) => request('DELETE', '/storyboards/' + id + '/assets/' + assetId),

    importPreview:(rawText, delimiter) => request('POST', '/storyboards/import/preview', { body: { rawText, delimiter, trimEmpty: true, dedupe: true } }),
    importConfirm:(rawText, delimiter, defaults) => request('POST', '/storyboards/import', { body: { rawText, delimiter, defaults, insertPosition: 'top' }, idempotencyKey: rid('') }),

    getSettings:  ()          => request('GET', '/settings'),
    putSettings:  (s)         => request('PUT', '/settings', { body: s }),
    resetSettings:(scopes)    => request('POST', '/settings/reset', { body: { scopes } })
  };

  global.Api = api;
})(window);

</script>

   app.js —— 状态、渲染与交互
   ---- 分层约定 ----
   api.js   只负责「请求 → 数据 / ApiError」，不碰 DOM
   app.js   只负责「数据 → DOM」与用户操作，不拼 URL
   ============================================================ */
(function () {

  /* ------------------------------------------------ 错误码 → 文案兜底 */

    tickSm:'<svg width="9" height="9" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" stroke="#0066CC" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    down:  '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" stroke="#7A7A7A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M18 6.5l-1 14H7l-1-14" stroke="#7A7A7A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    retry: '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.7-6" stroke="#D70015" stroke-width="1.9" fill="none" stroke-linecap="round"/><path d="M20.5 3.5v5h-5" stroke="#D70015" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    stop:  '<svg width="18" height="18" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="#7A7A7A"/></svg>',
    play:  '<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.34)"/><path d="M9.5 7.5l7 4.5-7 4.5z" fill="#fff"/></svg>',
    clock: '<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="#D2D2D7" stroke-width="1.8" fill="none"/><path d="M12 7.5v5l3.2 1.9" stroke="#D2D2D7" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
    alert: '<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="#D70015" stroke-width="1.8" fill="none"/><path d="M12 7.5v5.5M12 16.2h.01" stroke="#D70015" stroke-width="1.8" stroke-linecap="round"/></svg>',
    search:'<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#7A7A7A" stroke-width="2.2" fill="none"/><path d="M16.2 16.2L21 21" stroke="#7A7A7A" stroke-width="2.2" stroke-linecap="round"/></svg>',

  const COLUMNS = [

    { key: 'prop', w: 100, label: '道具', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 3.5l8 4.5v8l-8 4.5-8-4.5V8z" stroke="#7A7A7A" stroke-width="1.9" fill="none" stroke-linejoin="round"/><path d="M4 8l8 4.5L20 8M12 12.5v8" stroke="#7A7A7A" stroke-width="1.9" fill="none"/></svg>' },
    { key: 'firstFrame', w: 86, label: '首帧图', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M5 3.5v17" stroke="#7A7A7A" stroke-width="1.9" stroke-linecap="round"/><path d="M5 5.5h13l-2.6 3.8L18 13H5" stroke="#7A7A7A" stroke-width="1.9" fill="none" stroke-linejoin="round"/></svg>' },
    { key: 'storyboard', w: 84, label: '分镜图', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" stroke="#7A7A7A" stroke-width="1.9" fill="none"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="#7A7A7A" stroke-width="1.9" fill="none"/></svg>' },
    { key: 'result', w: 190, label: '结果与进度', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><rect x="2.5" y="5" width="13.5" height="14" rx="2.5" stroke="#7A7A7A" stroke-width="1.9" fill="none"/><path d="M16.5 10.2l5-2.7v9l-5-2.7z" stroke="#7A7A7A" stroke-width="1.9" fill="none" stroke-linejoin="round"/></svg>' },
    { key: 'status', w: 94, label: '状态', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="#7A7A7A" stroke-width="1.9" fill="none"/><path d="M8.5 12.2l2.6 2.6 4.6-5" stroke="#7A7A7A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { key: 'acts', w: 82, label: '操作', icon: '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h4M12 16h8" stroke="#7A7A7A" stroke-width="1.9" stroke-linecap="round"/><circle cx="16" cy="8" r="2" stroke="#7A7A7A" stroke-width="1.9" fill="none"/><circle cx="10" cy="16" r="2" stroke="#7A7A7A" stroke-width="1.9" fill="none"/></svg>' }
  ];

  /* ---------------------------------------------------------- 状态 */
  const S = {
    list: [], stats: null, options: null, adapter: null, settings: null,
    sel: new Set(), filter: 'all', keyword: '',
    panelTab: 'character', panelKeyword: '', assets: [], assetCounts: { currentShot: 0, library: 0 },
    bindTarget: null,            // { id, role }
    loading: true, error: null, busy: false,
    page: 1, pageSize: 50,
    poll: { timer: null, idle: 0 },
    imp: { raw: '', delimiter: { type: 'custom', value: ';;' }, preview: null, busy: false, timer: null }
  };
  const opts = () => S.options || Api.META;
  const rowById = (id) => S.list.find((r) => r.id === id);

  /* ---------------------------------------------------------- Toast */
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.transition = '.24s'; el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 2200);
    setTimeout(() => el.remove(), 2500);
  }
  const fail = (e) => toast(errText(e), 'err');

  /* ---------------------------------------------------------- 顶栏 */
  function renderTopbar() {
    const st = S.stats || {};
    $('#projName').textContent = (opts().projectName) || '未命名项目';
    $('#scopeChip').textContent = '第 1 批 · ' + (st.total || 0) + ' 个分镜';
    const d = S.settings && S.settings.defaults;
    $('#pillModelTxt').textContent = '模型 ' + (d ? (labelOf(opts().models, d.model) || d.model) : '—');
    $('#pillRatioTxt').textContent = '画幅 ' + (d ? d.ratio : '—');
    $('#runText').textContent = (st.generating || st.queued)
      ? '生成中 ' + (st.generating || 0) + ' · 排队中 ' + (st.queued || 0)
      : (st.total ? '全部就绪' : '—');
    const rs = $('.runstate');
    rs.classList.toggle('off', !S.adapter || !S.adapter.cliAvailable);
    rs.classList.toggle('err', !!S.error);
  }
  const labelOf = (arr, v) => { const o = (arr || []).find((x) => x.value === v); return o ? o.label : null; };

  /* ---------------------------------------------------------- 列头 */
  function renderColhead() {
    $('#colhead').innerHTML = COLUMNS.map((c) => {
      if (c.key === 'rail') return '<div class="c-rail">序号</div>';
      return '<div>' + c.icon + '<span>' + c.label + '</span></div>';
    }).join('');
  }

  /* ---------------------------------------------------------- 时长控件 */
  function durHTML(s) {
    const d = opts().duration;
    if (!s.canEditDuration) {
      return '<span class="dur locked" title="已完成，修改时长需重新生成"><span class="val" data-locked="1">' + s.durationSec + 's</span></span>';
    }
    return '<span class="dur" data-dur="' + s.id + '">' +
      '<button data-step="-1" title="减 1 秒"' + (s.durationSec <= d.min ? ' disabled' : '') + '>' + I.minus + '</button>' +
      '<span class="val" data-val="1" title="点击选预设 / 双击直接输入">' + s.durationSec + 's</span>' +
      '<button data-step="1" title="加 1 秒"' + (s.durationSec >= d.max ? ' disabled' : '') + '>' + I.plus + '</button>' +
      '</span>';
  }

  /* ---------------------------------------------------------- 行 */
  function slotsHTML(s, role) {
    const meta = ROLE_META[role];
    const items = s.assets.filter((a) => a.role === role);
    const canAdd = meta.multi ? true : items.length === 0;
    let out = '';
    items.forEach((a) => {
      out += '<span class="thumb" style="--g:' + (a.grad || Api.grad(a.assetId)) + '" title="' + esc(a.name) + '">' +
        '<span>' + esc(a.name) + '</span>' +
        '<button class="rm" data-unbind="' + a.assetId + '" data-role="' + role + '" title="移除">' + I.x + '</button>' +
        '</span>';
    });
    if (canAdd) out += '<button class="slot-add" data-bind="' + role + '" title="添加' + meta.label + '">' + I.add + '</button>';
    if (!items.length && !canAdd) out += '<span class="dash">—</span>';
    return out;
  }

  function resultHTML(s) {
    let inner;
    if (s.status === 'succeeded') {
      inner = '<span class="result-thumb" data-preview="' + s.id + '" style="--g:' + s.grad + '" title="预览产物">' + I.play + '</span>';
    } else if (s.status === 'failed') {
      inner = '<span class="result-thumb failed" title="' + esc(s.errorMessage || '生成失败') + '">' + I.alert + '</span>';
    } else {
      inner = '<span class="result-thumb plain">' + I.clock + '</span>';
    }
    const cls = s.status === 'succeeded' ? 'ok' : (s.status === 'failed' ? 'err' : '');
    return inner +
      '<span class="progline"><span class="bar"><i class="' + cls + '" style="width:' + Math.round(s.progress) + '%"></i></span>' +
      '<span class="pct">' + Math.round(s.progress) + '%</span></span>';
  }

  function actsHTML(s) {
    const busy = S.busy;
    const gen = s.status === 'generating' || s.status === 'queued';
    return '' +
      '<button class="icon-act" data-act="up" title="上移"' + (busy ? ' disabled' : '') + '>' + I.up + '</button>' +
      '<button class="icon-act" data-act="down" title="下移"' + (busy ? ' disabled' : '') + '>' + I.down + '</button>' +
      (s.status === 'failed'
        ? '<button class="icon-act" data-act="retry" title="重试"' + (busy ? ' disabled' : '') + '>' + I.retry + '</button>'
        : (gen
            ? '<button class="icon-act" data-act="cancel" title="取消"' + (busy ? ' disabled' : '') + '>' + I.stop + '</button>'
            : '<button class="icon-act" data-act="detail" title="查看 CLI 命令与日志"' + (busy ? ' disabled' : '') + '>' + I.search + '</button>')) +
      '<button class="icon-act" data-act="del" title="删除"' + (busy ? ' disabled' : '') + '>' + I.trash + '</button>';
  }

  function rowHTML(s) {
    const sel = S.sel.has(s.id);
    return '<div class="row' + (sel ? ' sel' : '') + '" data-id="' + s.id + '">' +
      '<div class="cell rail">' +
        '<span class="rail-num">' + s.seq + '</span>' +
        '<button class="cbx' + (sel ? ' on' : '') + '" data-check="1" title="选择">' + I.tick + '</button>' +
      '</div>' +
      '<div class="cell prompt">' +
        '<span class="titleline"><span class="shotno">分镜 ' + s.seq + '</span>' + durHTML(s) + '</span>' +
        '<span class="prompt-text">' + esc(s.prompt) + '</span>' +
        '<span class="prompt-meta">模型 ' + esc(s.model) + ' · ' + s.ratio + ' · ' + s.resolution + ' · motion ' + Number(s.motion).toFixed(2) + '</span>' +
      '</div>' +
      '<div class="cell"><span class="slots">' + slotsHTML(s, 'character') + '</span></div>' +
      '<div class="cell"><span class="slots">' + slotsHTML(s, 'scene') + '</span></div>' +
      '<div class="cell"><span class="slots">' + slotsHTML(s, 'prop') + '</span></div>' +
      '<div class="cell"><span class="slots">' + slotsHTML(s, 'firstFrame') + '</span></div>' +
      '<div class="cell"><span class="slots">' + slotsHTML(s, 'storyboard') + '</span></div>' +

  /* ---------------------------------------------------------- 表格三态 */
  function renderTable() {
    const host = $('#table');

      host.innerHTML = '<div class="skeleton">' + Array.from({ length: 4 }).map(() =>
        '<div class="sk-row">' +
          '<div class="sk" style="width:44px;height:26px"></div>' +
          '<div class="sk" style="flex:1;height:52px"></div>' +

          '<div class="sk" style="width:150px;height:20px"></div>' +

    if (S.error) {
      host.innerHTML = '<div class="errorbox">' + I.warn +
